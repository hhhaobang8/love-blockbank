<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Love Block Bank | 测试网交互面板</title>
  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
  <style>
    :root { --bg: #0f172a; --card: #1e293b; --accent: #8b5cf6; --text: #e2e8f0; }
    body { margin: 0; padding: 20px; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    .container { max-width: 600px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { margin: 0; font-size: 1.5rem; }
    button { background: var(--accent); color: white; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-weight: 600; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .card { background: var(--card); padding: 16px; border-radius: 12px; margin-bottom: 16px; }
    input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; }
    .log { background: #020617; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; max-height: 150px; overflow-y: auto; margin-top: 10px; }
    .badge { display: inline-block; padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; background: #334155; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>💜 Love Block Bank <span class="badge">Testnet</span></h1>
      <button id="connectBtn">连接钱包</button>
    </header>

    <div class="card">
      <p> 网络：<span id="network">未连接</span></p>
      <p> 地址：<span id="address">--</span></p>
      <p> tBNB 余额：<span id="balance">--</span></p>
      <p> 合约总参与人数：<span id="totalCount">--</span></p>
    </div>

    <div class="card">
      <h3>📥 参与互助 (Participate)</h3>
      <select id="tokenType">
        <option value="1">BTCB</option>
        <option value="2">ETH</option>
        <option value="3" selected>BNB</option>
        <option value="4">SOL</option>
        <option value="5">PAXG</option>
      </select>
      <input type="text" id="referrer" placeholder="推荐人地址 (0x...)">
      <button id="approveBtn">1. 授权代币 (Approve)</button>
      <button id="participateBtn" disabled>2. 确认参与 (Participate)</button>
    </div>

    <div class="card">
      <h3> 提现 (Withdraw)</h3>
      <select id="withdrawToken">
        <option value="1">BTCB</option>
        <option value="2">ETH</option>
        <option value="3" selected>BNB</option>
        <option value="4">SOL</option>
        <option value="5">PAXG</option>
      </select>
      <input type="number" id="withdrawAmount" placeholder="提现数量 (单位: Wei)">
      <button id="withdrawBtn">确认提现</button>
    </div>

    <div class="log" id="log">📜 操作日志将显示在此处...</div>
  </div>

  <script>
    // ⚠️ 部署后替换此处
    const CONTRACT_ADDRESS = "YOUR_DEPLOYED_CONTRACT_ADDRESS";
    const CONTRACT_ABI = [ /* 从 Remix 编译页点击 ABI 按钮复制完整 JSON 数组粘贴于此 */ ];

    const TOKEN_ADDRESSES = {
      1: "0x7130d2A12B9BCbFAe4f2634d864A1Ee1Ce3Ead9c", // BTCB (替换为测试网地址)
      2: "0x2170Ed0880ac9A755fd29B2688956BD959F933F8", // ETH
      3: "0xbb4CdB9CBd36B01bD1cBaEBF2De08d9173bc095c", // BNB
      4: "0x570A5D26f7765Ecb712C0924E4De545B89fD43dF", // SOL
      5: "0x7E32562f23987402D506A368132A8C1Da12e9A05"  // PAXG
    };

    let provider, signer, contract, tokenContract;
    const log = msg => document.getElementById('log').innerHTML += `<div>${msg}</div>`;

    const ERC20_ABI = [
      "function approve(address spender, uint256 amount) external returns (bool)",
      "function allowance(address owner, address spender) external view returns (uint256)",
      "function decimals() external view returns (uint8)"
    ];

    async function init() {
      if (!window.ethereum) return log("❌ 未检测到 MetaMask，请安装钱包插件");
      provider = new ethers.providers.Web3Provider(window.ethereum);
      
      window.ethereum.on("chainChanged", () => window.location.reload());
      window.ethereum.on("accountsChanged", () => window.location.reload());

      try {
        await provider.send("wallet_switchEthereumChain", [{ chainId: "0x61" }]); // 97 = 0x61
      } catch (e) {
        return log("⚠️ 请手动切换至 BSC Testnet (Chain ID: 97)");
      }

      signer = provider.getSigner();
      const addr = await signer.getAddress();
      document.getElementById('address').textContent = addr;
      document.getElementById('network').textContent = "BSC Testnet ✅";
      
      const bal = await provider.getBalance(addr);
      document.getElementById('balance').textContent = ethers.utils.formatEther(bal) + " tBNB";

      contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, signer);
      const count = await contract.totalCount();
      document.getElementById('totalCount').textContent = count.toString();
      
      document.getElementById('connectBtn').disabled = true;
      document.getElementById('connectBtn').textContent = "已连接";
      log("✅ 钱包连接成功，合约已加载");
    }

    async function getTokenContract(type) {
      const addr = TOKEN_ADDRESSES[type];
      return new ethers.Contract(addr, ERC20_ABI, signer);
    }

    document.getElementById('connectBtn').onclick = init;

    document.getElementById('approveBtn').onclick = async () => {
      const type = document.getElementById('tokenType').value;
      tokenContract = await getTokenContract(type);
      const amount = ethers.utils.parseUnits("1000", 18); // 授权固定额度
      try {
        log(`⏳ 正在授权代币 (Type: ${type})...`);
        const tx = await tokenContract.approve(CONTRACT_ADDRESS, amount);
        await tx.wait();
        log("✅ 授权成功！可进行参与操作");
        document.getElementById('participateBtn').disabled = false;
      } catch (err) { log("❌ 授权失败: " + err.reason); }
    };

    document.getElementById('participateBtn').onclick = async () => {
      const type = document.getElementById('tokenType').value;
      const ref = document.getElementById('referrer').value;
      if (!ethers.utils.isAddress(ref)) return log(" 推荐人地址格式错误");
      try {
        log(`⏳ 正在参与互助 (Type: ${type}, Ref: ${ref})...`);
        const tx = await contract.participate(ref, parseInt(type));
        await tx.wait();
        log("✅ 参与成功！等待区块确认...");
        const count = await contract.totalCount();
        document.getElementById('totalCount').textContent = count.toString();
      } catch (err) { log("❌ 参与失败: " + err.reason); }
    };

    document.getElementById('withdrawBtn').onclick = async () => {
      const type = document.getElementById('withdrawToken').value;
      const amt = document.getElementById('withdrawAmount').value;
      if (!amt || isNaN(amt)) return log(" 请输入提现数量");
      try {
        log(`⏳ 正在提现 (Type: ${type}, Amount: ${amt})...`);
        const tx = await contract.withdraw(parseInt(type), ethers.utils.parseUnits(amt, 18));
        await tx.wait();
        log("✅ 提现交易已上链");
      } catch (err) { log("❌ 提现失败: " + err.reason); }
    };
  </script>
</body>
</html>
